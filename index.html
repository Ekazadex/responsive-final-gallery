<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Architectural Landmarks Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <span class="sub-badge">Visual Archive</span>
        <h1>Global Architectural Horizons</h1>
        <p>A responsive visual survey exploring contemporary structural forms, bridge engineering, and geometric urban facades.</p>
    </header>

    <main id="gallery-container">
        <figure>
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800&auto=format&fit=crop&q=80" alt="Minimalist interior architectural room with white plastered walls and natural sunlight cast across polished oak floors">
            <figcaption>
                <p>Minimalist interior space exhibiting balanced daylight penetration across plain vertical planes.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&auto=format&fit=crop&q=80" alt="Low angle view of modern steel and blue tinted reflective glass skyscraper soaring into clear afternoon skies">
            <figcaption>
                <p>Modern curtain-wall skyscraper engineering engineered to distribute heavy wind shears through rigid internal trusses.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800&auto=format&fit=crop&q=80" alt="Brutalist concrete apartment building showcasing recessed balconies and textured geometric exterior modules">
            <figcaption>
                <p>Modular concrete residential facade utilizing raw exterior cantilevers for optimized passive shading.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&auto=format&fit=crop&q=80" alt="Contemporary studio room showcasing clean architectural line work and natural afternoon shadows">
            <figcaption>
                <p>Suspension bridge cabling distributing tens of thousands of metric tons across deep river foundations.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=800&auto=format&fit=crop&q=80" alt="Curved white contemporary pavilion roof structure framing open courtyard against bright blue sky">
            <figcaption>
                <p>Parametric curved pavilion roof sheltering public foot traffic while maintaining continuous air circulation.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=800&auto=format&fit=crop&q=80" alt="Symmetrical geometric ceiling structure of a modern museum showcasing triangular steel and glass patterns">
            <figcaption>
                <p>Geometric glass dome distributing natural zenith daylight uniformly across multi-tier exhibition halls.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=800&auto=format&fit=crop&q=80" alt="Spacious contemporary corporate office interior featuring open plan workstations and natural perimeter lighting">
            <figcaption>
                <p>Commercial interior envelope maximizing spatial efficiency through uninterrupted structural spans.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=800&auto=format&fit=crop&q=80" alt="Futuristic concert hall facade displaying sweeping exterior curves illuminated by subtle warm evening uplighting">
            <figcaption>
                <p>Acoustic shell geometry balancing sound wave propagation through computer-modeled surface radii.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1479839672679-a46483c0e7c8?w=800&auto=format&fit=crop&q=80" alt="Urban pedestrian plaza lined with modern granite pavers and reflective facade columns at twilight">
            <figcaption>
                <p>Urban civic plaza design integrating permeable ground surfaces with pedestrian-oriented public corridors.</p>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Architectural Landmarks Gallery. Developed for the Responsive Design Final Project.</p>
    </footer>

</body>
</html>
