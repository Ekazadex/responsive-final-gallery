<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Architectural Landmarks Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Global Architectural Horizons</h1>
        <p>A responsive visual survey exploring contemporary structural forms, bridge engineering, and geometric urban facades.</p>
    </header>

    <main id="gallery-container">
        <figure>
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600" alt="Minimalist interior architectural room with white plastered walls and natural sunlight cast across polished oak floors">
            <figcaption>
                <p>Minimalist interior space exhibiting balanced daylight penetration across plain vertical planes.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600" alt="Low angle view of modern steel and blue tinted reflective glass skyscraper soaring into clear afternoon skies">
            <figcaption>
                <p>Modern curtain-wall skyscraper engineering engineered to distribute heavy wind shears through rigid internal trusses.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=600" alt="Brutalist concrete apartment building showcasing recessed balconies and textured geometric exterior modules">
            <figcaption>
                <p>Modular concrete residential facade utilizing raw exterior cantilevers for optimized passive shading.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1477959858617-67f30bc75b82?w=600" alt="Aerial perspective of modern suspension bridge towers and illuminated cables crossing wide river channel at dusk">
            <figcaption>
                <p>Suspension bridge cabling distributing tens of thousands of metric tons across deep river foundations.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=600" alt="Curved white contemporary pavilion roof structure framing open courtyard against bright blue sky">
            <figcaption>
                <p>Parametric curved pavilion roof sheltering public foot traffic while maintaining continuous air circulation.</p>
            </figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Architectural Landmarks Gallery. Developed for the Responsive Design Final Project.</p>
    </footer>

</body>
</html>
